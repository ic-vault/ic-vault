[package]
name = "thin-slice-canister"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "=0.10.39"
ic-cdk = "=0.20.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_bytes = "=0.11.19"
ed25519-dalek = { version = "=3.0.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }

[dev-dependencies]
candid_parser = "=0.4.1"
